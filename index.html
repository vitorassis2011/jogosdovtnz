<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haja - Sistema de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .nav-active { background-color: #1e40af; border-left: 4px solid #60a5fa; color: white; }
    .input-style { border: 1px solid #e5e7eb; padding: 0.75rem; border-radius: 0.375rem; width: 100%; outline: none; transition: box-shadow 0.2s; }
    .input-style:focus { box-shadow: 0 0 0 2px #3b82f6; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

<div class="flex h-screen">

  <div class="w-64 bg-blue-900 text-white flex flex-col shadow-xl z-10">
    <div class="p-6 text-3xl font-bold border-b border-blue-800 flex items-center">
      <i class="fas fa-globe mr-3 text-blue-400"></i> Haja
    </div>
    <nav class="mt-4 flex-1 overflow-y-auto" id="sidebar-nav">
      <a href="#" onclick="showSection('clientes', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 nav-active transition-colors">
        <i class="fas fa-user w-6"></i> Clientes
      </a>
      <a href="#" onclick="showSection('produtos', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 transition-colors">
        <i class="fas fa-box w-6"></i> Produtos
      </a>
      <a href="#" onclick="showSection('funcionarios', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 transition-colors">
        <i class="fas fa-users w-6"></i> Funcionários
      </a>
      <a href="#" onclick="showSection('vendas', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 transition-colors">
        <i class="fas fa-shopping-cart w-6"></i> Vendas
      </a>
      <a href="#" onclick="showSection('estoque', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 transition-colors">
        <i class="fas fa-warehouse w-6"></i> Estoque
      </a>
      <div class="my-2 border-t border-blue-800"></div>
      <a href="#" onclick="showSection('relatorios', this)" class="nav-item flex items-center px-6 py-4 hover:bg-blue-800 transition-colors text-blue-300 hover:text-white">
        <i class="fas fa-chart-pie w-6"></i> Relatórios
      </a>
    </nav>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm p-4 flex justify-between items-center z-0 border-b">
      <h1 class="text-2xl font-semibold text-gray-800" id="page-title">Cadastro de Clientes</h1>
      <div class="text-sm text-gray-500"><i class="fas fa-calendar-alt mr-2"></i><span id="current-date"></span></div>
    </header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">

      <div id="section-clientes" class="section-div">
        <form id="form-cliente" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-sm mb-6 border">
          <input type="text" id="c_nome" placeholder="Nome completo" class="input-style" required>
          <input type="text" id="c_cpf" placeholder="CPF" class="input-style" required>
          <input type="text" id="c_cep" placeholder="CEP" class="input-style">
          <input type="tel" id="c_telefone" placeholder="Telefone" class="input-style">
          <select id="c_genero" class="input-style">
            <option value="">Gênero</option>
            <option>Masculino</option>
            <option>Feminino</option>
            <option>Outro</option>
          </select>
          <input type="email" id="c_email" placeholder="Email" class="input-style">
          <button type="submit" id="btn-cliente" class="md:col-span-2 bg-blue-600 text-white font-semibold py-3 rounded hover:bg-blue-700 transition">Cadastrar Cliente</button>
        </form>
        <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
          <table class="w-full text-left" id="table-clientes">
            <thead class="bg-gray-100 text-gray-600"><tr><th class="p-4 font-semibold">Nome</th><th class="p-4 font-semibold">CPF</th><th class="p-4 font-semibold">Telefone</th><th class="p-4 font-semibold">Email</th><th class="p-4 font-semibold">Ações</th></tr></thead>
            <tbody class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>

      <div id="section-produtos" class="section-div hidden">
        <form id="form-produto" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-sm mb-6 border">
          <input type="text" id="p_nome" placeholder="Nome do Produto" class="input-style" required>
          <input type="number" id="p_valor" placeholder="Valor (R$)" step="0.01" class="input-style" required>
          <input type="text" id="p_tamanho" placeholder="Tamanho" class="input-style">
          <input type="text" id="p_marca" placeholder="Marca" class="input-style">
          <input type="text" id="p_tipo" placeholder="Tipo" class="input-style">
          <input type="text" id="p_cor" placeholder="Cor" class="input-style">
          <textarea id="p_espec" placeholder="Especificação" class="input-style md:col-span-2 resize-none h-24"></textarea>
          <button type="submit" id="btn-produto" class="md:col-span-2 bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition">Cadastrar Produto</button>
        </form>
        <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
          <table class="w-full text-left" id="table-produtos">
            <thead class="bg-gray-100 text-gray-600"><tr><th class="p-4 font-semibold">Nome</th><th class="p-4 font-semibold">Marca</th><th class="p-4 font-semibold">Tipo</th><th class="p-4 font-semibold">Valor (R$)</th><th class="p-4 font-semibold">Ações</th></tr></thead>
            <tbody class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>

      <div id="section-funcionarios" class="section-div hidden">
        <form id="form-funcionario" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-sm mb-6 border">
          <input type="text" id="f_nome" placeholder="Nome" class="input-style" required>
          <input type="text" id="f_cpf" placeholder="CPF" class="input-style" required>
          <input type="text" id="f_cep" placeholder="CEP" class="input-style">
          <select id="f_genero" class="input-style"><option value="">Gênero</option><option>Masculino</option><option>Feminino</option></select>
          <select id="f_estado" class="input-style"><option value="">Estado Civil</option><option>Solteiro</option><option>Casado</option><option>Divorciado</option></select>
          <input type="text" id="f_cargo" placeholder="Cargo" class="input-style">
          <input type="number" id="f_idade" placeholder="Idade" class="input-style">
          <input type="number" id="f_salario" placeholder="Salário (R$)" step="0.01" class="input-style">
          <button type="submit" id="btn-funcionario" class="md:col-span-2 bg-purple-600 text-white font-semibold py-3 rounded hover:bg-purple-700 transition">Cadastrar Funcionário</button>
        </form>
        <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
          <table class="w-full text-left" id="table-funcionarios">
            <thead class="bg-gray-100 text-gray-600"><tr><th class="p-4 font-semibold">Nome</th><th class="p-4 font-semibold">Cargo</th><th class="p-4 font-semibold">Idade</th><th class="p-4 font-semibold">Salário (R$)</th><th class="p-4 font-semibold">Ações</th></tr></thead>
            <tbody class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>

      <div id="section-vendas" class="section-div hidden">
        <form id="form-venda" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow-sm mb-6 border">
          <input type="text" id="v_produto" placeholder="Nome/ID do Produto Vendido" class="input-style" required>
          <input type="number" id="v_qtd" placeholder="Quantidade Vendida" class="input-style" required>
          <input type="number" id="v_valortotal" placeholder="Valor Total Bruto (R$)" step="0.01" class="input-style" required>
          <input type="number" id="v_desconto" placeholder="Valor do Desconto (R$)" step="0.01" class="input-style">
          <input type="text" id="v_cor" placeholder="Cor" class="input-style">
          <input type="text" id="v_tamanho" placeholder="Tamanho" class="input-style">
          <button type="submit" id="btn-venda" class="md:col-span-2 bg-orange-600 text-white font-semibold py-3 rounded hover:bg-orange-700 transition">Registrar Venda</button>
        </form>
        <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
          <table class="w-full text-left" id="table-vendas">
            <thead class="bg-gray-100 text-gray-600"><tr><th class="p-4 font-semibold">Produto</th><th class="p-4 font-semibold">Qtd</th><th class="p-4 font-semibold">Total (R$)</th><th class="p-4 font-semibold">Desconto (R$)</th><th class="p-4 font-semibold">Ações</th></tr></thead>
            <tbody class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
