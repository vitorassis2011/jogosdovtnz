<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empresa XYZ - Sistema de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .nav-active { background-color: #1e40af; color: white; }
  </style>
</head>
<body class="bg-gray-100">

<div class="flex h-screen">

  <!-- Sidebar -->
  <div class="w-64 bg-blue-900 text-white">
    <div class="p-6 text-2xl font-bold border-b border-blue-800">🌐 Empresa XYZ</div>
    <nav class="mt-6">
      <a href="#" onclick="showSection('clientes')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800">
        <i class="fas fa-user mr-3"></i> Clientes
      </a>
      <a href="#" onclick="showSection('produtos')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800">
        <i class="fas fa-box mr-3"></i> Produtos
      </a>
      <a href="#" onclick="showSection('funcionarios')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800">
        <i class="fas fa-users mr-3"></i> Funcionários
      </a>
      <a href="#" onclick="showSection('vendas')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800">
        <i class="fas fa-shopping-cart mr-3"></i> Vendas
      </a>
      <a href="#" onclick="showSection('estoque')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800">
        <i class="fas fa-warehouse mr-3"></i> Estoque
      </a>
      <a href="#" onclick="showSection('relatorios')" class="nav-item flex items-center px-6 py-3 hover:bg-blue-800 nav-active">
        <i class="fas fa-chart-bar mr-3"></i> Relatórios
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-1 overflow-auto">

    <header class="bg-white shadow p-4 flex justify-between items-center">
      <h1 class="text-2xl font-semibold text-gray-800" id="page-title">Relatórios</h1>
    </header>

    <!-- ==================== RELATÓRIOS ==================== -->
    <div id="section-relatorios" class="p-6">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Relatório de Clientes -->
        <div class="bg-white p-6 rounded-xl shadow">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fas fa-user"></i> Total de Clientes</h2>
          <p id="total-clientes" class="text-4xl font-bold text-blue-600">0</p>
        </div>

        <!-- Relatório de Produtos -->
        <div class="bg-white p-6 rounded-xl shadow">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fas fa-box"></i> Total de Produtos</h2>
          <p id="total-produtos" class="text-4xl font-bold text-green-600">0</p>
        </div>

        <!-- Relatório de Vendas -->
        <div class="bg-white p-6 rounded-xl shadow">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2"><i class="fas fa-shopping-cart"></i> Total Vendido</h2>
          <p id="total-vendido" class="text-4xl font-bold text-orange-600">R$ 0,00</p>
        </div>

      </div>

      <div class="mt-8 bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-semibold mb-4">Relatório de Vendas por Produto</h2>
        <table class="w-full" id="table-relatorio-vendas">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-3 text-left">Produto</th>
              <th class="p-3 text-center">Qtd Vendida</th>
              <th class="p-3 text-right">Valor Total</th>
            </tr>
          </thead>
          <tbody class="text-gray-700"></tbody>
        </table>
      </div>

      <div class="mt-6 text-center">
        <button onclick="atualizarRelatorios()" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-medium">
          <i class="fas fa-sync"></i> Atualizar Relatórios
        </button>
      </div>
    </div>

    <!-- Outras seções (mantidas) -->
    <div id="section-clientes" class="p-6 hidden"> ... (mesmo conteúdo anterior) </div>
    <div id="section-produtos" class="p-6 hidden"> ... </div>
    <div id="section-funcionarios" class="p-6 hidden"> ... </div>
    <div id="section-vendas" class="p-6 hidden"> ... </div>
    <div id="section-estoque" class="p-6 hidden"> ... </div>

  </div>
</div>

<script>
// Arrays para armazenar dados
let clientes = [];
let produtos = [];
let funcionarios = [];
let vendas = [];

// Função para alternar seções
function showSection(section) {
  document.querySelectorAll('div[id^="section-"]').forEach(div => div.classList.add('hidden'));
  document.getElementById(`section-${section}`).classList.remove('hidden');
  document.getElementById('page-title').textContent = {
    'clientes': 'Cadastro de Clientes',
    'produtos': 'Cadastro de Produtos',
    'funcionarios': 'Cadastro de Funcionários',
    'vendas': 'Registro de Vendas',
    'estoque': 'Gestão de Estoque',
    'relatorios': 'Relatórios'
  }[section];
}

// Formulários (exemplo simplificado)
document.getElementById('form-cliente').addEventListener('submit', function(e) {
  e.preventDefault();
  clientes.push({
    nome: document.getElementById('nome').value,
    cpf: document.getElementById('cpf').value
  });
  this.reset();
  alert('Cliente cadastrado!');
  atualizarRelatorios();
});

// Formulário de Vendas
document.getElementById('form-venda').addEventListener('submit', function(e) {
  e.preventDefault();
  vendas.push({
    produto: "Produto " + document.getElementById('v_idproduto').value,
    quantidade: parseFloat(document.getElementById('v_qtd').value),
    valorTotal: parseFloat(document.getElementById('v_valortotal').value)
  });
  this.reset();
  alert('Venda registrada!');
  atualizarRelatorios();
});

// Atualizar Relatórios
function atualizarRelatorios() {
  // Totais
  document.getElementById('total-clientes').textContent = clientes.length;
  document.getElementById('total-produtos').textContent = produtos.length || 12; // exemplo

  let totalVendido = vendas.reduce((sum, v) => sum + (v.valorTotal || 0), 0);
  document.getElementById('total-vendido').textContent = `R$ ${totalVendido.toFixed(2)}`;

  // Tabela de Vendas
  const tbody = document.querySelector('#table-relatorio-vendas tbody');
  tbody.innerHTML = '';
  vendas.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="p-3">${v.produto}</td>
      <td class="p-3 text-center">${v.quantidade}</td>
      <td class="p-3 text-right font-medium">R$ ${v.valorTotal.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// Inicialização
showSection('relatorios');
atualizarRelatorios();
</script>

</body>
</html>
